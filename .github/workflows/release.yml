name: Release

# Swift Package Manager resolves versions from git tags, so a version tag (for example
# 1.0.0-rc.1) is the release. This workflow checks it and creates the GitHub release.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match Payriff.version
        run: grep -q "public static let version = \"$GITHUB_REF_NAME\"" Sources/Payriff/Payriff.swift || { echo "::error::Tag $GITHUB_REF_NAME does not match Payriff.version"; exit 1; }
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: swift test
      - name: Release notes from the CHANGELOG
        run: awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $flags
